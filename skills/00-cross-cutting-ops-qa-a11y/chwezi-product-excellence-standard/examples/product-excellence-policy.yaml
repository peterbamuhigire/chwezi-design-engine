# Chwezi Product Excellence Standard - machine-readable policy.
# Parent skill: ../SKILL.md. Binding text: doctrine/product-excellence-standard.md.
# The rules list is generated from references/rules-catalogue.md; the two must agree (PX-AGENT-011).
policy:
  id: chwezi-product-excellence-standard
  version: "1.0.2"
  effective_date: "2026-11-01"
  valid_until: "until further communication"
  adopted_by: "Lead Developer Peter Bamuhigire and the Chwezi Core Systems design team"
  authority: doctrine/product-excellence-standard.md
  rules_catalogue: skills/00-cross-cutting-ops-qa-a11y/chwezi-product-excellence-standard/references/rules-catalogue.md
  scope: "Every Chwezi app and system: Android, iOS, tablet, desktop and web. Existing web stacks keep their stack."
  certification: false

levels:
  MUST: "Required; observable and binary; no departure. Failure blocks release when the rule maps to a hard gate; otherwise it is a scored finding with an owner and a date."
  SHOULD: "Default; departure requires a DDR."
  MAY: "Optional; no record needed."

precedence:
  - law_safety_privacy
  - accessibility
  - data_integrity
  - product_excellence_standard
  - house_style_visual_layer
  - product_brand

evidence_states:
  facts: [VERIFIED, CHANGED, NOT_ASSESSED]
  release_evidence: [MEASURED, HEURISTIC, NOT_ASSESSED]
  gate_closure_requires: MEASURED

evidence_types:
  SHOT: "Screenshot set with stated widths, themes, text scale and locale"
  UIT: "Automated UI, unit or integration test result"
  TRACE: "Trace or benchmark from the declared baseline device"
  AT: "Assistive-technology or keyboard run log"
  LINT: "Guardrail, static or dependency check output"
  CONTRACT: "Screen or component contract file"
  REVIEW: "Recorded checklist review with reviewer name"
  RECON: "Reconciliation report against ledger or report"
  NET: "Network or analytics capture"
  STUDY: "Usability study or timed task log"
  FIELD: "Field test report in the real environment"
  PROFILE: "Device, locale or configuration profile file"
  DDR: "Design decision record"
  SIGN: "Signed review or release record"

required_screen_states:
  na_requires_reason: true
  states:
  - {id: initial_loading, na_allowed: false, treatment: "Static skeleton in final geometry; no looping shimmer; announced once"}
  - {id: content, na_allowed: false, treatment: "Baseline populated state"}
  - {id: refreshing, na_allowed: true, treatment: "Current content kept; progress in header; never blanks"}
  - {id: empty, na_allowed: true, treatment: "Names the cause, what belongs here, one next action"}
  - {id: filtered_empty, na_allowed: true, treatment: "Shows active filter, clear action and 0 of N"}
  - {id: error, na_allowed: false, treatment: "What happened, what is safe, what next; retry"}
  - {id: offline_cached, na_allowed: true, treatment: "Cached data labelled with last sync time; mutation rule stated"}
  - {id: queued_change, na_allowed: true, treatment: "Marked pending; never styled as confirmed"}
  - {id: syncing, na_allowed: true, treatment: "Progress with count; user keeps working"}
  - {id: conflict, na_allowed: true, treatment: "Both versions with actor and time; authorised choice; nothing silently dropped"}
  - {id: permission_restricted, na_allowed: true, treatment: "Explains restriction and who can grant it; masked values say Restricted"}
  - {id: session_expired, na_allowed: true, treatment: "Re-authentication keeps the draft and returns to the same place"}
  - {id: success, na_allowed: false, treatment: "States exactly what was saved, queued or completed and the next step"}

hard_fail_gates:
  - {id: PX-GATE-01, title: Duplicates, test: "Double tap, timeout-retry and offline replay create exactly one record"}
  - {id: PX-GATE-02, title: False confirmation, test: "No saved, paid, sent or live before confirmation; queued never confirmed; stale never live"}
  - {id: PX-GATE-03, title: Numbers do not reconcile, test: "Money, stock, tax and clinical values reconcile; currency minor unit correct"}
  - {id: PX-GATE-04, title: Interface-only authorisation, test: "Low-role API calls to restricted actions are denied"}
  - {id: PX-GATE-05, title: Sensitive data exposed, test: "Role matrix, recents, screenshot and analytics checks show no exposure"}
  - {id: PX-GATE-06, title: Accessibility failure, test: "Zero applicable WCAG 2.2 AA failures; core tasks done with screen reader and keyboard"}
  - {id: PX-GATE-07, title: Large-text loss, test: "No primary action or essential value lost at 200% text"}
  - {id: PX-GATE-08, title: Work lost or blocked, test: "Kill, rotate, back, offline and non-core outages lose nothing and block nothing"}
  - {id: PX-GATE-09, title: Invented or fabricated content, test: "No fixtures in production; every field and destination traces to a requirement"}
  - {id: PX-GATE-10, title: Missing state, test: "Every canonical state evidenced or declared N/A with a reason"}
  - {id: PX-GATE-11, title: Device budget broken, test: "Baseline-device traces within budget; vitals below bad-behaviour thresholds"}
  - {id: PX-GATE-12, title: Unverified release, test: "Independent verifier and, for financial or clinical change, a human domain reviewer"}
  - {id: PX-GATE-13, title: Document numbering broken, applies_when: "screen issues numbered documents", test: "Numbers contiguous per tenant and type, allocated at issue from a locked counter, stable on replay, provisional offline, voided never deleted"}

scorecard:
  scale: {min: 0, max: 4, scaled_to: 100}
  rubric:
    4: "All checks MEASURED and within target"
    3: "All checks MEASURED; minor misses with owned fixes; no gate affected"
    2: "Some checks HEURISTIC only, or measured misses on non-critical items"
    1: "Major gaps; several checks NOT_ASSESSED"
    0: "Critical failure or no evidence"
  dimensions:
    - {id: task_usability_speed, weight: 25}
    - {id: reliability_recovery, weight: 20}
    - {id: visual_interaction_craft, weight: 15}
    - {id: accessibility_inclusion, weight: 15}
    - {id: performance_efficiency, weight: 15}
    - {id: security_data_trust, weight: 10}
  thresholds: {pass: 85, conditional_min: 70, pass_min_dimension_score: 2, dimension_score_capping_at_conditional: 1, dimension_score_blocking: 0}
  unmeasured_applicable_gate_counts_as_open: true
  verdicts:
    PASS: "score >= 85 and zero open gates and no dimension below 2"
    CONDITIONAL: "zero open gates, no dimension at 0, score 70-84 or any dimension at 1 (a 1 caps at CONDITIONAL); every shortfall owned and dated; written acceptance by product owner and Lead Developer; pilot only"
    BLOCKED: "any open gate (applicable gate NOT_ASSESSED counts as open), any dimension at 0, score < 70, or CONDITIONAL case lacking owner, date or written acceptance"
  conditional_acceptance_by: [product_owner, lead_developer]
  high_score_offsets_gate: false

owner_defaults:
  recorded: "owner default, 2026-11-07"
  languages: [English, Luganda, Swahili, French, Arabic, Kinyarwanda, Spanish]
  rtl_test_language: Arabic
  test_longest_language: true
  idle_lock_minutes: {shared_pos: 2, clinical: 5, back_office: 15, level: SHOULD, tenant_configurable: true}
  accent_model: "per-product brand primary plus one shared amber next-step accent; extra colours need a DDR"
  semantic_roles: [success, warning, danger, info, neutral]
  card_radius_source: house_style
  kpi_component_name: KpiCard
  fiscal_e_invoicing_label: "fiscal e-invoicing (e.g. URA EFRIS)"
  stale_after_minutes_operational: 15

currency_minor_units:
  source: "ISO 4217 List One, published 2026-09-17 (currentness CR:C1)"
  UGX: 0
  RWF: 0
  KES: 2
  TZS: 2
  USD: 2
  overrides_money_figures_two_decimal_rule: true

platform_baselines:
  android:
    play_target_api: 36
    edge_to_edge_opt_out: false
    predictive_back_default: true
    orientation_lock_ignored_min_smallest_width_dp: 600
    touch_target_dp: 48
    glove_touch_target_dp: 56
    vitals: {crash_rate_overall_pct: 1.09, anr_rate_overall_pct: 0.47, per_model_pct: 8, window_days: 28}
    startup_excessive_s: {cold: 5, warm: 2}
    chwezi_hot_start_target_s: 1
  ios:
    touch_target_pt: 44
    text_scale_min_pct: 200
  web:
    target_floor_css_px: 24
    touch_primary_target_css_px: 44
    core_web_vitals_good_p75: {lcp_s: 2.5, inp_ms: 200, cls: 0.1}
  window_width_classes_dp: {compact: [0, 599], medium: [600, 839], expanded: [840, 1199], large: [1200, 1599], extra_large: [1600, null]}
  window_height_classes_dp: {compact: [0, 479], medium: [480, 899], expanded: [900, null]}
  text_scale_test_pct: 200
  wcag: "2.2 AA"
  reduced_motion: "Chwezi house MUST (WCAG 2.3.3 is AAA)"
  currentness_access_date: "2026-11-07"

