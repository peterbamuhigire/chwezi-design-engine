schema_version: "1.0"
engine_id: chwezi-design-engine
display_name: Chwezi Design Engine
contract_version: "1.0"
version: "1.1.0"
router:
  path: AGENTS.md
skills:
  discovery_glob: skills/**/SKILL.md
validation:
  - id: release-gate
    command: >-
      python -X utf8 scripts/validate_engine.py --baseline tests/quality-baseline.json
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
agent_integration:
  supported_modes: [full, sequential, read_only, not_assessed]
  local_context_files: [AGENTS.md, .skills-engine/AGENTS-INTEGRATION.md]
  mcp_safe_tools: [discover_engine, read_router, read_skill, validate_documented_checks]
  approval_required_for: [write_files, pull, update, publish, external_message]
  forbidden_operations: [git_reset, git_clean, force_push, arbitrary_shell, broad_delete]
  fork_behavior: inspect_local_router_without_inventing_validators
source_of_truth:
  router: AGENTS.md
  skills: skills/**/SKILL.md
  references: references/**
claude_only_block: |
  - These skills are NOT on Claude Code's native skill-discovery path. Read the `SKILL.md` files
    directly; do not use the `Skill` tool for them.
invariants:
  - id: book-extraction-ban
    phrase: "Book extractions, book summaries and chapter-by-chapter notes must never be stored in this"
  - id: not-assessed
    phrase: "Missing render, device, accessibility, content, or reviewer evidence is `NOT ASSESSED`, never a pass."
  - id: banned-font-primary
    phrase: "No banned AI-slop fonts as primary type (`doctrine/references/ai-slop-banned-fonts.md`)."
invariant_exemptions:
  british-english: "No British English output rule exists in the design router (AGENTS.md, former CLAUDE.md, README.md, rules/); adding one is new doctrine outside M10-02-T02 scope."
plugin_exclusions:
  - path: "skills/_TEMPLATE"
    reason: "authoring template copied when a new skill is created; not an active skill"
